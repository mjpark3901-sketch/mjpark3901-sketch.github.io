<!DOCTYPE html>
<meta charset="utf-8">
<title>mobile preview</title>
<style>
  html,body{margin:0;padding:0;background:#ffffff}
  iframe{display:block;width:390px;height:844px;border:0}
</style>
<iframe id="f" src="https://mjpark3901-sketch.github.io/" title="mobile preview" width="390" height="844"></iframe>
<script>
  var f = document.getElementById('f');
  f.addEventListener('load', function () {
    var d = f.contentDocument;
    var el = d.querySelector('#history');
    if (el) f.contentWindow.scrollTo(0, el.getBoundingClientRect().top + f.contentWindow.scrollY - 8);
  });
</script>
